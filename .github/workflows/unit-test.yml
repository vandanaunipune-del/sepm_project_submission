name: Unit Tests

on:
  workflow_call:

jobs:
  test:
    name: Hardhat unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run unit tests
        run: npx hardhat test mocha
